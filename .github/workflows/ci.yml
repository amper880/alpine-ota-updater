name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type check, tests, front-end build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
