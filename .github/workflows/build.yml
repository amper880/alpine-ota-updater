# Builds the installers:
#   - Windows: NSIS setup (.exe) and MSI
#   - Android: signed APK (arm64 + armv7)
# Artifacts are attached to every run (Actions → run → Artifacts). Pushing a tag "vX.Y.Z"
# also creates a GitHub Release with the files.
#
# Android signing (optional but recommended, see docs/BUILDING.md): repository secrets
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# Without them a temporary key is generated, and every new APK must be installed after
# uninstalling the previous one.
name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ALPINE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npm run icons
      - run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: alpine-ota-updater-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The Ubuntu runner image ships the Android SDK (ANDROID_HOME) with cmdline-tools;
      # only the exact platform, build-tools and NDK versions are added here.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npm run icons
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --ci --target aarch64 --target armv7
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No Android signing secrets configured; using a temporary key."
            PASS="temporary"; ALIAS="alpine"
            keytool -genkeypair -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Alpine OTA Updater (temporary)"
          fi
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "out/alpine-ota-updater-${VERSION}.apk" aligned.apk
          "$BT/apksigner" verify "out/alpine-ota-updater-${VERSION}.apk"
          rm -f release.jks
      - uses: actions/upload-artifact@v7
        with:
          name: alpine-ota-updater-android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
